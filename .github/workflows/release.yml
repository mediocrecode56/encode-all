# Builds and unit-tests every push to main; a pushed v* tag also publishes the release
# (installer, update zip, SHA256SUMS) that the in-app updater reads.
name: release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Toolchain on PATH
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          "ISCC=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path src\version.h -Pattern '#define EA_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "version.h says $v but the tag is ${{ github.ref_name }}" }
      - name: Build, test, package
        shell: pwsh
        run: ./build.ps1 -Release
      - uses: actions/upload-artifact@v4
        with:
          name: encode-all
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v)) .*?\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Encode All $v" }
          $notes += "`n`nInstall with EncodeAll-Setup-$v.exe (per user, no admin). Installed copies update themselves from EncodeAll-$v-win64.zip, checked against SHA256SUMS."
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create "${{ github.ref_name }}" dist/* --title "Encode All $v" --notes-file notes.md
